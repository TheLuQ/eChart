services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.test.backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL}
        PYTHON_VERSION: ${PYTHON_VERSION}
    container_name: composeback
    hostname: backendservice
    networks:
      - echart-backend_devcontainer_default

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
        NGINX_VERSION: ${NGINX_VERSION}
        API_ENDPOINT: ${API_ENDPOINT}
    container_name: composefront
    env_file:
      - .env
    ports:
      - 127.0.0.1:4322:8080
    networks:
      - echart-backend_devcontainer_default

networks:
  echart-backend_devcontainer_default:
    external: true
